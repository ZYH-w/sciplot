<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#146c5d">
  <meta name="description" content="简图 SciPlot，本地科研绘图工作台。导入数据，选择模板，轻松生成论文级图表。">
  <title>简图 SciPlot · 科研绘图工作台</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <script src="./assets/xlsx.full.min.js" defer></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./" aria-label="简图 SciPlot 首页"><span class="brand-mark"><svg viewBox="0 0 30 30"><path d="M5 21 11 14 16 18 25 7"/><path d="M5 7v17h21" class="axis"/><circle cx="11" cy="14" r="2"/><circle cx="16" cy="18" r="2"/><circle cx="25" cy="7" r="2"/></svg></span><span>简图 <b>SciPlot</b><small>让科研表达更简单</small></span></a>
    <nav class="header-nav"><span class="nav-active">绘图工作台</span><button data-action="templates">模板库 <span class="tiny-badge">6</span></button></nav>
    <div class="header-right"><span class="local-label"><i></i>本地工作空间</span><button class="icon-button" data-action="help" aria-label="使用帮助" title="使用帮助">?</button><span class="avatar">研</span></div>
  </header>
  <section class="project-bar">
    <div class="project-title"><div class="project-path">我的工作空间 <span>/</span> 科研绘图</div><div class="project-name-row"><input id="project-name" aria-label="项目名称" value="轨迹响应对比研究"><span class="saved-status" id="saved-status">已保存到本地</span></div></div>
    <div class="project-actions"><button class="button soft" data-action="process" id="process-button" aria-label="数据处理"><span style="font-family:Georgia,serif;font-size:19px">ƒ</span> 数据处理</button><button class="button ghost" data-action="open-project" id="open-project-button"></button><button class="button ghost" data-action="save-project" id="save-project-button"></button><button class="button primary" data-action="export" id="export-button"></button></div>
  </section>
  <main class="workspace">
    <aside class="left-panel"><div class="panel-tabs" role="tablist" aria-label="数据与模板"><button data-left="data" class="active" role="tab" aria-selected="true">数据</button><button data-left="templates" role="tab" aria-selected="false">模板</button><button data-left="palettes" role="tab" aria-selected="false">配色</button></div><div id="left-content" class="left-content"></div><div class="privacy-note"><span id="privacy-icon"></span><span>数据留在你的设备<br><small>无需上传，安心创作</small></span></div></aside>
    <section class="center-panel">
      <div class="canvas-toolbar"><div class="canvas-tab"><span id="chart-icon"></span><strong>图表预览</strong><span class="live-pill">实时</span></div><div class="canvas-tools"><button class="icon-button" data-action="undo" aria-label="撤销" title="撤销 Ctrl+Z"></button><button class="icon-button" data-action="redo" aria-label="重做" title="重做 Ctrl+Shift+Z"></button><span class="toolbar-divider"></span><button class="tool-button" data-action="select-region" id="region-button"></button><button class="icon-button" data-action="fullscreen" aria-label="放大画布" title="放大画布"></button></div></div>
      <div class="canvas-stage" id="canvas-stage"><div class="canvas-caption"><span id="template-caption">经典期刊 · 折线 + 散点</span><span>可编辑的矢量画布</span></div><div class="paper" id="paper"><div id="plot-container"></div><div id="selection-box" hidden></div></div><div class="canvas-bottom"><span><i class="canvas-status-dot"></i><span id="chart-meta"></span></span><button data-action="fit" class="zoom-label">自适应 <span>100%</span></button></div><div class="canvas-hint" id="canvas-hint"></div></div>
      <section class="data-preview" id="data-preview"><div class="data-preview-header"><button data-action="toggle-table" class="preview-title"><span id="table-icon"></span>数据预览 <span id="row-count"></span></button><div><button class="text-button" data-action="download-data">导出数据</button><button class="text-button" data-action="import">替换数据</button></div></div><div class="table-scroll" id="preview-table"></div><div class="data-preview-footer" id="data-preview-footer"></div></section>
    </section>
    <aside class="right-panel"><div class="inspector-heading"><strong>图表设置</strong><button class="text-button" data-action="reset-style">重置样式</button></div><div class="inspector-tabs" role="tablist" aria-label="图表设置"><button class="active" data-right="style" role="tab">样式</button><button data-right="axes" role="tab">坐标</button><button data-right="details" role="tab">细节</button></div><div id="inspector-content"></div><div class="inspector-bottom"><span>满意这组样式？</span><button class="text-button" data-action="save-template">保存为模板</button></div></aside>
  </main>
  <footer class="status-bar"><span>简图 SciPlot <b>1.0</b><span class="status-divider">|</span>为专注研究的你而作</span><span>CSV · TXT · XLSX · XLS · ODS <span class="status-divider">|</span><span id="footer-points"></span></span></footer>
  <input type="file" id="data-file" accept=".csv,.tsv,.txt,.dat,.xlsx,.xls,.xlsm,.ods,.json" hidden><input type="file" id="project-file" accept=".json,.sciplot" hidden>
  <dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div><div id="drop-overlay" hidden><div><strong>松开，开始绘图</strong><span>Excel、CSV、TXT、TSV、ODS 或 JSON</span></div></div>
</body>
</html>
